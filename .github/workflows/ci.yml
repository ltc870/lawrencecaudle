# CI for the portfolio, blog, and API
# Runs on every pull request into main (opened, and each new push to the PR's branch).
# main itself only ever changes by merging a pull request that passed these checks.

name: CI

on:
  pull_request:
    branches: [main]
  # No push trigger: main only changes by merging a pull request.

# Read-only token: the jobs only need to read the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # The Angular workspace lives in frontend/, so every run step starts there
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json # the lock file lives in frontend/

      - name: Install dependencies from the lock file
        run: npm ci

      - name: Test the portfolio
        run: npx ng test portfolio --no-watch

      - name: Test the blog
        run: npx ng test blog --no-watch

      - name: Build the portfolio
        run: npx ng build portfolio

      - name: Build the blog
        run: npx ng build blog

  backend:
    name: Backend
    # The .NET solution lives in backend/, so every run step starts there.
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore LawrenceCaudle.Blog.slnx 

      - name: Build
        run: dotnet build LawrenceCaudle.Blog.slnx --configuration Release --no-restore 

      - name: Test
        run: dotnet test LawrenceCaudle.Blog.slnx --configuration Release --no-build 
